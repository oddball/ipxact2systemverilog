[project]
description = "Generate VHDL, SystemVerilog, html, rst, md, pdf, c headers from an IPXACT description"
readme = "README.md"
version = "1.0.30"
name = "ipxact2systemverilog"
authors = [
  {name = "oddball"},
]
keywords = ["ipxact2systemverilog", "ipxact2vhdl", "ipxact2c", "ipxact2py", "VHDL", "SystemVerilog", "html", "rst", "md", "pdf", "IPXACT", "python"]
requires-python = ">= 3"
dependencies = [
  "docutils",
  "lxml",
  "mdutils",
  "restructuredtext-lint",
  "sphinx",
  "sphinxcontrib-wavedrom",
  "rstcloth",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Embedded Systems",
  "Programming Language :: Python :: 3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ipxact2systemverilog"]

[project.scripts]
ipxact2c = "ipxact2systemverilog.cli:main_c"
ipxact2md = "ipxact2systemverilog.cli:main_md"
ipxact2rst = "ipxact2systemverilog.cli:main_rst"
ipxact2systemverilog = "ipxact2systemverilog.cli:main_systemverilog"
ipxact2vhdl = "ipxact2systemverilog.cli:main_vhdl"
ipxact2py = "ipxact2systemverilog.cli:main_py"


[project.optional-dependencies]
dev = [
  "ruff",
]

[project.urls]
Repository = "https://github.com/oddball/ipxact2systemverilog"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# To include Git sub modules
ipxact2systemverilog = [
    "xml/**/*.xsd",
    "xml/**/README.md",
    "xml/**/LICENSE.md", 
]

[tool.ruff]
line-length = 159
target-version = "py311"
extend-exclude = [
  "example",
  "ipxact2systemverilog/xml",
]

[tool.ruff.lint]
# E/F catch real bugs, I keeps imports ordered, N enforces PEP 8 names.
select = ["E", "F", "I", "N"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Existing import paths. Renaming these modules would break callers.
"ipxact2systemverilog/ipxact2hdlCommon.py" = ["N999"]
# Copied verbatim into generated acces_layer.py. accesLayer and the
# exception names are part of that generated API.
"ipxact2systemverilog/ipxact2pyCommon.py" = ["N801", "N818", "N999"]
